name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet, format and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Console typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Committed web/dist matches the source
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "web/dist is out of date: run 'make web' and commit web/dist."
            git status --short -- dist
            exit 1
          fi

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cloud-safeguard:ci .
      - name: First start initialises and answers /healthz
        run: |
          docker run -d --name csg -p 8787:8787 cloud-safeguard:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/healthz
      - name: Container logs
        if: failure()
        run: docker logs csg 2>&1 | tail -40
      - if: always()
        run: docker rm -f csg || true
