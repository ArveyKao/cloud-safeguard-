# HTTPS in front of the service. Adjust the class and the certificate source
# (cert-manager shown; on EKS with the AWS Load Balancer Controller use its
# annotations and an ACM certificate instead).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-safeguard
  namespace: cloud-safeguard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [csg.example.com]
      secretName: cloud-safeguard-tls
  rules:
    - host: csg.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: cloud-safeguard, port: { name: http } } }
